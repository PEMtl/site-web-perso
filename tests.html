<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smoke Tests — pe-monreal.com</title>
    <style>
        :root { --pass: #2b8a3e; --fail: #c92a2a; --bg: #f8f9fa; --card: #fff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: var(--bg); padding: 2rem; color: #333; }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        .meta { font-size: 0.85rem; color: #666; margin-bottom: 2rem; }
        .suite { background: var(--card); border-radius: 10px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
        .suite h2 { font-size: 1rem; margin-bottom: 1rem; border-bottom: 1px solid #eee; padding-bottom: 0.5rem; color: #555; text-transform: uppercase; letter-spacing: 0.05em; }
        .test { display: flex; align-items: baseline; gap: 0.75rem; padding: 0.4rem 0; border-bottom: 1px solid #f0f0f0; font-size: 0.9rem; }
        .test:last-child { border-bottom: none; }
        .badge { font-weight: 700; font-size: 0.75rem; padding: 2px 8px; border-radius: 4px; flex-shrink: 0; }
        .pass { background: #d3f9d8; color: var(--pass); }
        .fail { background: #ffe3e3; color: var(--fail); }
        .skip { background: #e9ecef; color: #868e96; }
        .detail { font-size: 0.78rem; color: #999; margin-left: auto; }
        #summary { position: sticky; top: 0; background: var(--bg); padding: 0.75rem 0; margin-bottom: 1rem; font-weight: 600; font-size: 1.1rem; }
        #summary.all-pass { color: var(--pass); }
        #summary.has-fail  { color: var(--fail); }
    </style>
</head>
<body>

<h1>🧪 Smoke Tests — pe-monreal.com</h1>
<p class="meta">À ouvrir après chaque déploiement. Tests statiques : ne nécessitent pas de serveur.</p>
<div id="summary">⏳ Exécution en cours…</div>

<div id="results"></div>

<script>
// ─────────────────────────────────────────────
// Micro framework de test
// ─────────────────────────────────────────────
const suites = [];
let totalPass = 0, totalFail = 0;

function suite(name, fn) { suites.push({ name, tests: [], fn }); }
function _record(suite, label, passed, detail = '') {
    suite.tests.push({ label, passed, detail });
    if (passed) totalPass++; else totalFail++;
}

// ─────────────────────────────────────────────
// SUITE 1 : Structure DOM (nécessite index.html chargé dans même domaine)
// En mode standalone (file://) on teste ce qu'on peut
// ─────────────────────────────────────────────
suite('Structure HTML', (s) => {
    const checks = [
        ['<html lang="fr"> présent',      () => document.documentElement.lang === 'fr'],
        ['<title> non vide',               () => document.title.length > 0],
        ['meta description présente',      () => !!document.querySelector('meta[name="description"]')],
        ['meta og:title présente',         () => !!document.querySelector('meta[property="og:title"]')],
        ['meta twitter:card présente',     () => !!document.querySelector('meta[name="twitter:card"]')],
        ['link canonical présent',         () => !!document.querySelector('link[rel="canonical"]')],
        ['link manifest présent',          () => !!document.querySelector('link[rel="manifest"]')],
        ['skip-link présent',              () => !!document.querySelector('.skip-link')],
        ['nav.site-nav présente',          () => !!document.querySelector('.site-nav')],
        ['#main-content présent',          () => !!document.getElementById('main-content')],
        ['section #accueil présente',      () => !!document.getElementById('accueil')],
        ['section #a-propos présente',     () => !!document.getElementById('a-propos')],
        ['section #competences présente',  () => !!document.getElementById('competences')],
        ['section #references présente',   () => !!document.getElementById('references')],
        ['section #contact présente',      () => !!document.getElementById('contact')],
        ['photo profil width défini',      () => { const img = document.querySelector('.hero-photo img'); return img && img.getAttribute('width') === '250'; }],
        ['photo profil height défini',     () => { const img = document.querySelector('.hero-photo img'); return img && img.getAttribute('height') === '250'; }],
        ['photo profil alt non vide',      () => { const img = document.querySelector('.hero-photo img'); return img && img.alt.length > 0; }],
        ['JSON-LD Person présent',         () => { const s = document.querySelector('script[type="application/ld+json"]'); return s && s.textContent.includes('"Person"'); }],
        ['footer présent',                 () => !!document.querySelector('footer')],
        ['#copyright-year présent',        () => !!document.getElementById('copyright-year')],
        ['#theme-toggle présent',          () => !!document.getElementById('theme-toggle')],
    ];
    checks.forEach(([label, fn]) => {
        try { _record(s, label, fn()); }
        catch(e) { _record(s, label, false, e.message); }
    });
});

// ─────────────────────────────────────────────
// SUITE 2 : Formulaire contact
// ─────────────────────────────────────────────
suite('Formulaire contact', (s) => {
    const form = document.getElementById('contact-form');
    const checks = [
        ['#contact-form présent',              () => !!form],
        ['action pointe vers Formspree',        () => form && form.action.includes('formspree.io')],
        ['method POST',                         () => form && form.method === 'post'],
        ['honeypot _gotcha présent',            () => !!document.querySelector('input[name="_gotcha"]')],
        ['honeypot aria-hidden="true"',         () => { const el = document.querySelector('input[name="_gotcha"]'); return el && el.getAttribute('aria-hidden') === 'true'; }],
        ['champ name présent',                  () => !!document.querySelector('input[name="name"]')],
        ['champ email présent',                 () => !!document.querySelector('input[name="email"]')],
        ['champ message présent',               () => !!document.querySelector('textarea[name="message"]')],
        ['champ email type=email',              () => { const el = document.querySelector('input[name="email"]'); return el && el.type === 'email'; }],
        ['champ message minlength≥10',          () => { const el = document.querySelector('textarea[name="message"]'); return el && parseInt(el.minLength) >= 10; }],
        ['#form-status role="alert"',           () => { const el = document.getElementById('form-status'); return el && el.getAttribute('role') === 'alert'; }],
        ['#form-status aria-live="polite"',     () => { const el = document.getElementById('form-status'); return el && el.getAttribute('aria-live') === 'polite'; }],
        ['bouton submit présent',               () => !!document.querySelector('#contact-form button[type="submit"]')],
    ];
    checks.forEach(([label, fn]) => {
        try { _record(s, label, fn()); }
        catch(e) { _record(s, label, false, e.message); }
    });
});

// ─────────────────────────────────────────────
// SUITE 3 : Accessibilité
// ─────────────────────────────────────────────
suite('Accessibilité', (s) => {
    const checks = [
        ['skip-link href="#main-content"',       () => document.querySelector('.skip-link')?.getAttribute('href') === '#main-content'],
        ['nav aria-label présent',               () => !!document.querySelector('nav[aria-label]')],
        ['#copy-email-btn aria-label',           () => !!document.querySelector('#copy-email-btn[aria-label]')],
        ['#theme-toggle aria-label',             () => !!document.querySelector('#theme-toggle[aria-label]')],
        ['back-to-top aria-label',               () => !!document.querySelector('.back-to-top[aria-label]')],
        ['tous les <img> ont un alt',            () => [...document.querySelectorAll('img')].every(img => img.hasAttribute('alt'))],
        ['skills-grid role="list"',              () => document.querySelectorAll('.skills-grid[role="list"]').length > 0],
        ['background-shapes aria-hidden',        () => document.querySelector('.background-shapes')?.getAttribute('aria-hidden') === 'true'],
    ];
    checks.forEach(([label, fn]) => {
        try { _record(s, label, fn()); }
        catch(e) { _record(s, label, false, e.message); }
    });
});

// ─────────────────────────────────────────────
// SUITE 4 : CSS / Performance
// ─────────────────────────────────────────────
suite('CSS & Performance', (s) => {
    const checks = [
        ['style.css chargé en <link>',             () => !!document.querySelector('link[href*="style.css"]')],
        ['preload photo profil',                    () => !!document.querySelector('link[rel="preload"][as="image"]')],
        ['preload font regular',                    () => !!document.querySelector('link[rel="preload"][href*="regular"]')],
        ['preload font 600',                        () => !!document.querySelector('link[rel="preload"][href*="600"]')],
        ['pas de <style> inline dans <head>',       () => document.querySelectorAll('head style').length === 0],
        ['fetchpriority="high" sur photo profil',   () => document.querySelector('.hero-photo img')?.getAttribute('fetchpriority') === 'high'],
        ['loading="eager" sur photo profil',        () => document.querySelector('.hero-photo img')?.getAttribute('loading') === 'eager'],
        ['logos références loading="lazy"',         () => { const logos = document.querySelectorAll('.entity-logo[loading]'); return logos.length > 0 && [...logos].every(l => l.getAttribute('loading') === 'lazy'); }],
    ];
    checks.forEach(([label, fn]) => {
        try { _record(s, label, fn()); }
        catch(e) { _record(s, label, false, e.message); }
    });
});

// ─────────────────────────────────────────────
// SUITE 5 : Liens & navigation
// ─────────────────────────────────────────────
suite('Liens & navigation', (s) => {
    const extLinks = [...document.querySelectorAll('a[target="_blank"]')];
    const checks = [
        ['nav contient 5 liens',                    () => document.querySelectorAll('.nav-links a').length === 5],
        ['nav lien #accueil présent',               () => !!document.querySelector('.nav-links a[href="#accueil"]')],
        ['nav lien #contact présent',               () => !!document.querySelector('.nav-links a[href="#contact"]')],
        ['liens externes ont rel=noopener',         () => extLinks.every(a => a.rel.includes('noopener'))],
        ['liens externes ont rel=noreferrer',       () => extLinks.every(a => a.rel.includes('noreferrer'))],
        ['email en mailto: cliquable',              () => !!document.querySelector('a[href^="mailto:"]')],
        ['Calendly en target="_blank"',             () => !!document.querySelector('a[href*="calendly.com"][target="_blank"]')],
        ['lien CV téléchargeable présent',          () => !!document.querySelector('a[href*="drive.google.com"]')],
        ['.back-to-top href="#accueil"',            () => document.querySelector('.back-to-top')?.getAttribute('href') === '#accueil'],
    ];
    checks.forEach(([label, fn]) => {
        try { _record(s, label, fn()); }
        catch(e) { _record(s, label, false, e.message); }
    });
});

// ─────────────────────────────────────────────
// Rendu
// ─────────────────────────────────────────────
const container = document.getElementById('results');
suites.forEach(s => {
    s.fn(s);
    const div = document.createElement('div');
    div.className = 'suite';
    div.innerHTML = `<h2>${s.name}</h2>` + s.tests.map(t =>
        `<div class="test">
            <span class="badge ${t.passed ? 'pass' : 'fail'}">${t.passed ? 'PASS' : 'FAIL'}</span>
            <span>${t.label}</span>
            ${t.detail ? `<span class="detail">${t.detail}</span>` : ''}
        </div>`
    ).join('');
    container.appendChild(div);
});

const summary = document.getElementById('summary');
const total = totalPass + totalFail;
if (totalFail === 0) {
    summary.textContent = `✅ ${totalPass}/${total} tests passés — TOUT EST OK`;
    summary.className = 'all-pass';
} else {
    summary.textContent = `❌ ${totalFail} ÉCHEC(S) sur ${total} tests — ${totalPass} passés`;
    summary.className = 'has-fail';
}
</script>
</body>
</html>
