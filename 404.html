<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page introuvable (404) | Pierre-Etienne Monreal</title>
    <meta name="description" content="Cette page n'existe pas ou plus.">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#1a202c">
    <link rel="icon" href="/images/favicon-32x32.png" sizes="32x32" type="image/png">
    <!-- Pas de SRI ici volontairement : une 404 doit toujours s'afficher,
         même si le hash de style.css est temporairement désynchronisé ailleurs. -->
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="background-shapes" aria-hidden="true"></div>
<main class="container">
    <section class="card content-section error-page">
        <h1 class="error-code">404</h1>
        <h2 class="error-title">Page introuvable</h2>
        <p class="error-text">Cette page n'existe pas ou a été déplacée.</p>
        <div class="cta-buttons-group centered">
            <a href="/" class="cta-button">🏠 Retour à l'accueil</a>
            <a href="/#contact" class="cta-button secondary">📨 Me contacter</a>
        </div>
    </section>
</main>
</body>
</html>
