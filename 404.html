<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page introuvable (404) | Pierre-Etienne Monreal</title>
    <meta name="description" content="La page demandée est introuvable. Retournez à l'accueil du site de Pierre-Etienne Monreal, Product Owner Senior à Montpellier.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://www.pe-monreal.com/404.html">

    <link rel="icon"             href="/images/favicon-32x32.png" sizes="32x32" type="image/png">
    <link rel="icon"             href="/images/favicon-16x16.png" sizes="16x16" type="image/png">
    <link rel="apple-touch-icon" href="/images/favicon-32x32.png">

    <link rel="preload" as="font" href="/fonts/manrope-v20-latin-regular.woff2" type="font/woff2" crossorigin>

    <link rel="preload" as="style" href="/style.css">

<body>

<a href="#main-content" class="skip-link">Aller au contenu principal</a>
<div class="background-shapes" aria-hidden="true"></div>

<main class="container error-page" id="main-content">
    <section class="card error-card" aria-labelledby="error-title">
        <p class="error-code" aria-hidden="true">404</p>
        <h1 id="error-title">Page introuvable</h1>
        <p class="error-message">La page que vous cherchez n'existe pas, a été déplacée ou l'adresse contient une erreur.</p>
        <div class="error-actions">
            <a href="/" class="cta-button">← Retour à l'accueil</a>
            <a href="/#contact" class="cta-button secondary">Me contacter</a>
        </div>
    </section>
</main>

<footer>
    <div class="footer-content">
        <p>Tous droits réservés &mdash; &copy; <span id="copyright-year"></span> Pierre-Etienne Monreal</p>
        <button id="theme-toggle" class="theme-toggle" aria-label="Passer en mode sombre">
            <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/>
                <line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/>
                <line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
            <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
        </button>
    </div>
</footer>

<script src="/script.js" defer></script>

</html>
